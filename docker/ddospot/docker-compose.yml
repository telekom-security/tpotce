networks:
  ddospot_local:

services:

# Ddospot service
  ddospot:
    build: .
    container_name: ddospot
    restart: always
#    cpu_count: 1
#    cpus: 0.25
    networks:
     - ddospot_local
    ports:
     - "19:19/udp"
     - "53:53/udp"
     - "53:53/tcp"
     - "123:123/udp"
     - "1900:1900/udp"
    environment:
     - DDOSPOT_DNS_RECURSION=on
    image: "dtagdevsec/ddospot:24.04.2"
    read_only: true
    volumes:
     - $HOME/tpotce/data/ddospot/log:/var/log/ddospot
