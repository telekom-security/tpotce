# Cases for the retention rule of the ILM policy tpot (TPOT_ES_RETENTION), shared by
# both implementations:
#   bash in tpotinit:  docker/tpotinit/dist/bin/es_retention.sh  (docker/_tests/tests/tpotinit_ilm.sh)
#   Python in tpot:    tpotctl/elastic.py                        (tpotctl/tests/test_elastic.py)
#
# values: min_age of the delete phase (none: no delete phase) -> the .env value it stands for,
#         "" when it stands for none (T-Pot then never adopts it).
# shapes: whole policy objects -> the value they stand for
# cases:  policy is what GET _ilm/policy/tpot returns under .tpot.policy (null: no policy),
#         value is TPOT_ES_RETENTION, force the explicit "apply .env anyway" (--force).
#         A foreign policy whose value equals the (non-empty) .env value is adopted: update writes
#         only the marker (and the same duration in days), nothing is deleted that was kept.
#         Expected: action (create | update | keep | foreign) and for create / update the written
#         policy: min_age of its delete phase (none: no delete phase), retention (_meta.tpot_retention)
#         and phases, all phases it has.
#         current: what the policy stands for before the change ("" none, see values).
#         managed: whether T-Pot wrote it last (for no policy: true).
#         Another action is pending: a shorter value that is not applied.
# shorten: true   the user confirmed a shorter retention (Manager / CLI); tpotinit never sets it
# oldest_days: N  the oldest logstash-* index is N days old (runners use now = 1800000000)
# held: "N"       expected: a shorter value that is not applied (pending, or create with off)
# actions: [...]  expected: the keys of phases.delete.actions of the written policy
# 30d-noaction    a min_age of values: both runners build it as delete: {min_age: 30d, actions: {}}
legacy: &legacy
  phases:
    hot: {min_age: 0ms, actions: {}}
    delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
  _meta: {managed: true, description: T-Pot ILM policy with a retention of 30 days}
values:
  - {min_age: 30d, value: "30"}
  - {min_age: 3650d, value: "3650"}
  - {min_age: 720h, value: "30"}
  - {min_age: none, value: "off"}
  - {min_age: 0d, value: ""}
  - {min_age: 36h, value: ""}
  - {min_age: 3651d, value: ""}
  - {min_age: 90m, value: ""}
  - {min_age: 1d, value: "1"}
  - {min_age: 30d-noaction, value: ""}
shapes:
  - {name: empty object, policy: {}, value: ""}
  - {name: error body of elasticsearch, policy: {error: {type: resource_not_found_exception}, status: 404}, value: ""}
  - {name: GET answer not unwrapped, policy: {tpot: {policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: {min_age: 30d, actions: {delete: {}}}}}}}, value: ""}
  - {name: only a hot phase, policy: {phases: {hot: {min_age: 0ms, actions: {}}}}, value: "off"}
  - {name: delete phase without a delete action, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: {min_age: 30d, actions: {}}}}, value: ""}
  - {name: delete phase with only wait_for_snapshot, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: {min_age: 30d, actions: {wait_for_snapshot: {policy: daily}}}}}, value: ""}
  - {name: delete phase is null, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: null}}, value: ""}
  - {name: delete phase is a string, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: x}}, value: ""}
  - {name: delete phase is a list, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: []}}, value: ""}
  - {name: phases is a string, policy: {phases: x}, value: ""}
  - {name: phases is a list, policy: {phases: []}, value: ""}
  - {name: min_age with a trailing newline, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: {min_age: "30d\n", actions: {delete: {}}}}}, value: ""}
  - {name: min_age in hours with a trailing newline, policy: {phases: {hot: {min_age: 0ms, actions: {}}, delete: {min_age: "720h\n", actions: {delete: {}}}}}, value: ""}
cases:
  - name: no policy, default
    policy: null
    value: "30"
    current: ""
    managed: true
    action: create
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
  - name: no policy, off
    policy: null
    value: "off"
    current: ""
    managed: true
    action: create
    min_age: none
    retention: "off"
    phases: [hot]
  - name: no policy, empty value creates off
    policy: null
    value: ""
    current: ""
    managed: true
    action: create
    min_age: none
    retention: "off"
    phases: [hot]
  - name: policy of an earlier release, same value, only the marker is added
    policy: *legacy
    value: "30"
    current: "30"
    managed: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
  - name: policy of an earlier release, longer value
    policy: *legacy
    value: "90"
    current: "30"
    managed: true
    action: update
    min_age: 90d
    retention: "90"
    phases: [delete, hot]
  - name: policy of an earlier release, empty value leaves it alone
    policy: *legacy
    value: ""
    current: "30"
    managed: true
    action: keep
  - name: policy of an earlier release edited to 365 days in Kibana
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 365d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, description: T-Pot ILM policy with a retention of 30 days}
    value: "30"
    current: "365"
    managed: false
    action: foreign
  - name: policy of an earlier release with a warm phase added in Kibana, another value
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        warm: {min_age: 7d, actions: {forcemerge: {max_num_segments: 1}}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, description: T-Pot ILM policy with a retention of 30 days}
    value: "90"
    current: "30"
    managed: false
    action: foreign
  - name: foreign 365 days, the same value adopts it
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 365d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, description: T-Pot ILM policy with a retention of 30 days}
    value: "365"
    current: "365"
    managed: false
    action: update
    min_age: 365d
    retention: "365"
    phases: [delete, hot]
  - name: foreign in hours, the same value adopts it
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 720h, actions: {delete: {}}}
    value: "30"
    current: "30"
    managed: false
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
  - name: foreign with a warm phase and the same value keeps the warm phase
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        warm: {min_age: 7d, actions: {forcemerge: {max_num_segments: 1}}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, description: T-Pot ILM policy with a retention of 30 days}
    value: "30"
    current: "30"
    managed: false
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot, warm]
  - name: managed, nothing to do
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 90d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "90", description: x}
    value: "90"
    current: "90"
    managed: true
    action: keep
  - name: managed, shorter value
    shorten: true
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 90d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "90", description: x}
    value: "7"
    current: "90"
    managed: true
    action: update
    min_age: 7d
    retention: "7"
    phases: [delete, hot]
  - name: managed with a warm phase, only the delete phase changes
    shorten: true
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        warm: {min_age: 7d, actions: {forcemerge: {max_num_segments: 1}}}
        delete: {min_age: 90d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "90", description: x}
    value: "30"
    current: "90"
    managed: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot, warm]
  # T-Pot writes the marker as a string: a number is no marker of T-Pot (whatever jq or Python make of it)
  - name: the marker as the number 30.0 is foreign, the same days are adopted
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: 30.0, description: x}
    value: "30"
    current: "30"
    managed: false
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
  - name: the marker as the number 30 is foreign, the same days are adopted
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: 30, description: x}
    value: "30"
    current: "30"
    managed: false
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
  - name: the marker as the number 30 is foreign, a longer value leaves it alone
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: 30, description: x}
    value: "60"
    current: "30"
    managed: false
    action: foreign
  - name: the marker as the number 30.0 is foreign, a longer value leaves it alone
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: 30.0, description: x}
    value: "60"
    current: "30"
    managed: false
    action: foreign
  - name: the marker as the number 30 with --force, written as a string
    force: true
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: 30, description: x}
    value: "60"
    current: "30"
    managed: false
    action: update
    min_age: 60d
    retention: "60"
    phases: [delete, hot]
  - name: a marker of null is foreign
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: null, description: x}
    value: "60"
    current: "30"
    managed: false
    action: foreign
  - name: a marker of 30.5 is no whole number of days
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: 30.5, description: x}
    value: "60"
    current: "30"
    managed: false
    action: foreign
  - name: managed off, a value adds the delete phase
    shorten: true
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
      _meta: {managed: true, tpot_retention: "off", description: x}
    value: "30"
    current: "off"
    managed: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
  - name: managed, off removes the delete phase
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "30", description: x}
    value: "off"
    current: "30"
    managed: true
    action: update
    min_age: none
    retention: "off"
    phases: [hot]
  - name: managed, but the delete phase was changed in Kibana
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 120d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "90", description: x}
    value: "90"
    current: "120"
    managed: false
    action: foreign
  - name: managed off, but a delete phase was added in Kibana
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 400d, actions: {delete: {}}}
      _meta: {managed: true, tpot_retention: "off", description: x}
    value: "off"
    current: "400"
    managed: false
    action: foreign
  - name: a policy of its own without any marker
    policy:
      phases:
        hot: {min_age: 0ms, actions: {rollover: {max_age: 1d}}}
        delete: {min_age: 45d, actions: {delete: {}}}
    value: "30"
    current: "45"
    managed: false
    action: foreign
  - name: force applies the value to a foreign policy, keeping its other phases
    policy:
      phases:
        hot: {min_age: 0ms, actions: {rollover: {max_age: 1d}}}
        delete: {min_age: 45d, actions: {delete: {}}}
    value: "60"
    current: "45"
    managed: false
    force: true
    action: update
    min_age: 60d
    retention: "60"
    phases: [delete, hot]
  - name: a policy put back by restore.sh is managed again
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 60d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "60", description: x}
    value: "60"
    current: "60"
    managed: true
    action: keep
  - name: no policy, a value but older indices creates off and the value waits
    policy: null
    value: "30"
    oldest_days: 45
    action: create
    min_age: none
    retention: "off"
    phases: [hot]
    held: "30"
    current: ""
    managed: true
  - name: no policy, a value and only younger indices
    policy: null
    value: "30"
    oldest_days: 10
    action: create
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
    current: ""
    managed: true
  - name: no policy, older indices, confirmed
    policy: null
    value: "30"
    oldest_days: 45
    shorten: true
    action: create
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
    current: ""
    managed: true
  - name: managed, a shorter value without confirmation waits
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 90d, actions: {delete: {delete_searchable_snapshot: true}}}
      _meta: {managed: true, tpot_retention: "90", description: x}
    value: "7"
    action: pending
    held: "7"
    current: "90"
    managed: true
  - name: managed off, a value without confirmation waits
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
      _meta: {managed: true, tpot_retention: "off", description: x}
    value: "30"
    action: pending
    held: "30"
    current: "off"
    managed: true
  - name: force with a shorter value waits without confirmation
    policy:
      phases:
        hot: {min_age: 0ms, actions: {rollover: {max_age: 1d}}}
        delete: {min_age: 45d, actions: {delete: {}}}
    value: "7"
    force: true
    action: pending
    held: "7"
    current: "45"
    managed: false
  - name: a marker without a delete action is foreign
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 30d, actions: {}}
      _meta: {managed: true, tpot_retention: "30", description: x}
    value: "30"
    action: foreign
    current: ""
    managed: false
  - name: force on an empty delete phase adds the delete action
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {}
    value: "30"
    force: true
    shorten: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
    actions: [delete]
    current: ""
    managed: false
  - name: force keeps wait_for_snapshot and adds the delete action
    policy:
      phases:
        hot: {min_age: 0ms, actions: {}}
        delete: {min_age: 60d, actions: {wait_for_snapshot: {policy: daily}}}
    value: "30"
    force: true
    shorten: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
    actions: [delete, wait_for_snapshot]
    current: ""
    managed: false
  - name: force on an empty policy builds the default hot phase and the delete phase
    policy: {}
    value: "30"
    force: true
    shorten: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
    actions: [delete]
    current: ""
    managed: false
  - name: force on a policy that is no object builds the default hot phase and the delete phase
    policy: []
    value: "30"
    force: true
    shorten: true
    action: update
    min_age: 30d
    retention: "30"
    phases: [delete, hot]
    actions: [delete]
    current: ""
    managed: false
