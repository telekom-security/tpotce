# T-Pot .env schema: the rules for every setting in env.example.
#
# One source for both sides: tpotinit checks .env against it on every start
# (dist/bin/env_validate.sh, via yq) and the tpot command builds its settings page
# and `tpot env check` from it (tpotctl/envschema.py). Change env.example and this
# file together, `python3 -m unittest discover tpotctl/tests` fails otherwise.
#
# Per key, all optional except type:
#   section          base | honeypots | system, as in env.example
#   title, help      shown by tpot
#   type             text | path | enum | int | number | regex | host | url | timezone |
#                    interface | htpasswd_list | basic_cred
#   values           enum: the accepted values, exact match
#   optional         enum: an empty value is fine, otherwise empty is an invalid value
#   min, max         int and number
#   pattern          regex (bash =~ syntax, no backslashes), checked when not empty
#   message          the error for a value that does not fit, {value} is replaced
#   required         must not be empty ("is not set or empty.")
#   safe             only a-z A-Z 0-9 _ / . : - are accepted
#   scope            HIVE | SENSOR: only checked on that type of T-Pot
#   services         only checked if the active compose file runs one of them
#   default          used for an empty value in conditions (and shown by tpot)
#   on_invalid       default: an invalid value is a warning and the default is used
#   required_when    {key, values}: required while that key (or its default) is one of
#                    the values, required_message is the error, {when} is replaced
#   warn_empty       a warning while the value is empty
#   warn_when        {key, values} + warn_message: a warning while the value is empty
#                    and that key is one of the values
#   secret           tpot masks the value
#   editable         false: tpot shows it, but does not change it
#
# Only for the settings page of tpot (tpotinit does not read them):
#   widget           switch (values[0] is on, values[1] off) | choice | interface |
#                    timezone | llm_model
#   choices          choice: [{value, label}], the values on offer
#   custom           choice: a value of your own is possible too (checked by type/pattern)
#   show_when        {key, values}: only shown while that key (or its default) is one of
#                    the values
#   llm              llm_model: {provider, url, api_key}, the keys to ask the server with
#   unlock           editable false: tpot can unlock the key after showing this warning
version: 1
keys:

  # T-Pot Base Settings

  WEB_USER:
    section: base
    title: Web users
    help: Users of the T-Pot web UI, managed with tpot users (or genuser.sh).
    type: htpasswd_list
    scope: HIVE
    required: true
    secret: true
    editable: false

  LS_WEB_USER:
    section: base
    title: Sensor users
    help: One user per SENSOR that submits its logs to this HIVE, managed with tpot sensors (or deploy.sh).
    type: htpasswd_list
    scope: HIVE
    warn_empty: not set, T-Pots of type SENSOR will not be able to submit logs to this HIVE.
    secret: true
    editable: false

  TPOT_BLACKHOLE:
    section: base
    title: Blackhole
    help: Null-route known mass scanners. T-Pot gets less traffic, but stays off their maps.
    type: enum
    values: [ENABLED, DISABLED]
    default: DISABLED
    widget: switch

  TPOT_PERSISTENCE:
    section: base
    title: Keep honeypot logs
    help: "on: rotate the honeypot logs, off: delete them on every start (i.e. for a Raspberry Pi)."
    type: enum
    values: ["on", "off"]
    default: "on"
    widget: switch

  TPOT_PERSISTENCE_CYCLES:
    section: base
    title: Log rotation cycles
    help: How many T-Pot restarts the honeypot logs are kept for.
    type: int
    min: 1
    max: 999
    default: "30"
    on_invalid: default
    message: is not set, invalid or out of bounds. Using default of 30 cycles.

  TPOT_TYPE:
    section: base
    title: T-Pot type
    help: HIVE collects and shows the data, a SENSOR sends its data to a HIVE. Use the matching edition.
    type: enum
    values: [HIVE, SENSOR]
    default: HIVE

  TPOT_HIVE_USER:
    section: base
    title: HIVE user
    help: base64 of user:password of this SENSOR on the HIVE, set by tpot sensors add (or deploy.sh) on the HIVE.
    type: basic_cred
    scope: SENSOR
    required: true
    secret: true
    editable: false

  LS_SSL_VERIFICATION:
    section: base
    title: Verify the HIVE certificate
    help: "full: verify the certificate of the HIVE, none: only for tests."
    type: enum
    values: [full, none]
    optional: true
    scope: SENSOR
    default: full

  TPOT_HIVE_IP:
    section: base
    title: HIVE address
    help: IP or domain name of the HIVE, as in its certificate.
    type: host
    scope: SENSOR
    required: true

  TPOT_ATTACKMAP_TEXT:
    section: base
    title: Attack Map console output
    help: Print the Attack Map events in the log of map_data.
    type: enum
    values: [ENABLED, DISABLED]
    default: ENABLED
    widget: switch

  TPOT_ATTACKMAP_TEXT_TIMEZONE:
    section: base
    title: Attack Map time zone
    help: i.e. UTC, Europe/Berlin
    type: timezone
    required: true
    safe: true
    default: UTC
    widget: timezone

  # Honeypots / Tools settings

  OINKCODE:
    section: honeypots
    title: Suricata Oinkcode
    help: OPEN for the ET Open rules, your Oinkcode for ET Pro.
    type: regex
    pattern: "^(OPEN|[A-Za-z0-9]+)$"
    message: has to be OPEN or your Oinkcode (letters and digits only).
    services: [suricata]
    secret: true
    default: OPEN

  SURICATA_RULES_UPDATE:
    section: honeypots
    title: Suricata rule updates
    help: "on: update the rules once in 24 hours, off: never download rules."
    type: enum
    values: ["on", "off"]
    optional: true
    services: [suricata]
    default: "on"
    widget: switch

  TPOT_CAPTURE_INTERFACE:
    section: honeypots
    title: Capture interface
    help: Interface of Suricata, P0f and Glutton, empty picks the one of the route to the internet.
    type: interface
    services: [suricata, p0f, glutton]
    widget: interface

  BEELZEBUB_LLM_PROVIDER:
    section: honeypots
    title: Beelzebub LLM provider
    type: enum
    values: [ollama, openai]
    optional: true
    services: [beelzebub]
    default: ollama

  BEELZEBUB_LLM_MODEL:
    section: honeypots
    title: Beelzebub LLM model
    help: i.e. openchat (ollama) or gpt-4o (openai)
    type: text
    services: [beelzebub]
    widget: llm_model
    llm: {provider: BEELZEBUB_LLM_PROVIDER, url: BEELZEBUB_LLM_HOST, api_key: BEELZEBUB_LLM_API_KEY}

  BEELZEBUB_LLM_HOST:
    section: honeypots
    title: Beelzebub LLM endpoint
    help: Full URL of the chat endpoint, empty for the default of the provider.
    type: url
    services: [beelzebub]

  BEELZEBUB_LLM_API_KEY:
    section: honeypots
    title: Beelzebub LLM API key
    help: Only for openai.
    type: text
    services: [beelzebub]
    secret: true
    warn_when: {key: BEELZEBUB_LLM_PROVIDER, values: [openai]}
    warn_message: not set, the openai provider needs one.
    show_when: {key: BEELZEBUB_LLM_PROVIDER, values: [openai]}

  GALAH_LLM_PROVIDER:
    section: honeypots
    title: Galah LLM provider
    type: enum
    values: [ollama, openai, anthropic, googleai, gcp-vertex, cohere]
    optional: true
    services: [galah]
    default: ollama

  GALAH_LLM_SERVER_URL:
    section: honeypots
    title: Galah Ollama URL
    help: URL of your Ollama backend, empty for the other providers.
    type: url
    services: [galah]
    required_when: {key: GALAH_LLM_PROVIDER, values: [ollama]}
    required_message: is required for the {when} provider.
    show_when: {key: GALAH_LLM_PROVIDER, values: [ollama]}

  GALAH_LLM_MODEL:
    section: honeypots
    title: Galah LLM model
    help: i.e. llama3.1 (ollama) or gpt-4o (openai)
    type: text
    services: [galah]
    widget: llm_model
    llm: {provider: GALAH_LLM_PROVIDER, url: GALAH_LLM_SERVER_URL, api_key: GALAH_LLM_API_KEY}

  GALAH_LLM_TEMPERATURE:
    section: honeypots
    title: Galah temperature
    help: 0 to 2, higher values make the answers more random.
    type: number
    min: 0
    max: 2
    message: has to be a number from 0 to 2.
    services: [galah]

  GALAH_LLM_API_KEY:
    section: honeypots
    title: Galah LLM API key
    help: For all providers but ollama and gcp-vertex.
    type: text
    services: [galah]
    secret: true
    required_when: {key: GALAH_LLM_PROVIDER, values: [openai, anthropic, googleai, cohere]}
    required_message: is required for the {when} provider.
    show_when: {key: GALAH_LLM_PROVIDER, values: [openai, anthropic, googleai, cohere]}

  GALAH_LLM_CLOUD_LOCATION:
    section: honeypots
    title: Galah GCP location
    help: Only for gcp-vertex.
    type: text
    services: [galah]
    required_when: {key: GALAH_LLM_PROVIDER, values: [gcp-vertex]}
    required_message: is required for the {when} provider.
    show_when: {key: GALAH_LLM_PROVIDER, values: [gcp-vertex]}

  GALAH_LLM_CLOUD_PROJECT:
    section: honeypots
    title: Galah GCP project
    help: Only for gcp-vertex.
    type: text
    services: [galah]
    required_when: {key: GALAH_LLM_PROVIDER, values: [gcp-vertex]}
    required_message: is required for the {when} provider.
    show_when: {key: GALAH_LLM_PROVIDER, values: [gcp-vertex]}

  # NEVER MAKE CHANGES TO THIS SECTION UNLESS YOU REALLY KNOW WHAT YOU ARE DOING

  TPOT_DOCKER_SOCK:
    section: system
    title: docker.sock path
    type: path
    editable: false
    unlock: "tpotinit and autoheal reach Docker through it. Only change it for a Docker socket in another place (i.e. rootless Docker), T-Pot does not start when it is wrong."

  TPOT_DOCKER_ENV:
    section: system
    title: docker compose .env
    type: path
    editable: false
    unlock: "docker compose inside tpotinit reads this .env through it. A wrong path stops T-Pot on the next start."

  TPOT_DOCKER_COMPOSE:
    section: system
    title: Compose file
    type: path
    editable: false
    unlock: "The compose file T-Pot starts. The customizer, update.sh and tpot expect docker-compose.yml, another file is not updated by them."

  TPOT_REPO:
    section: system
    title: Image registry
    help: ghcr.io/telekom-security (GitHub) or dtagdevsec (Docker Hub).
    type: text
    required: true
    safe: true
    widget: choice
    choices:
      - {value: ghcr.io/telekom-security, label: GitHub Container Registry}
      - {value: dtagdevsec, label: Docker Hub}
    custom: true

  TPOT_VERSION:
    section: system
    title: Image tag
    type: text
    required: true
    safe: true
    editable: false
    unlock: "The tag of every T-Pot image. update.sh sets it with the release; a tag of another release mixes images that may not work together."

  TPOT_PULL_POLICY:
    section: system
    title: Pull policy
    help: always, missing, never, build, daily, weekly or every_<duration>.
    type: regex
    pattern: "^(always|missing|never|build|daily|weekly|every_[0-9a-z]+)$"
    message: 'invalid value "{value}", allowed: always missing never build daily weekly every_<duration>.'
    required: true
    safe: true
    widget: choice
    choices:
      - {value: always, label: "always, pull on every start"}
      - {value: missing, label: "missing, pull only images that are not there"}
      - {value: daily, label: "daily, look for new images once a day"}
      - {value: weekly, label: "weekly, look for new images once a week"}
      - {value: never, label: "never, use the local images only"}
      - {value: build, label: "build, build the images locally"}
    custom: true

  TPOT_DATA_PATH:
    section: system
    title: Data path
    type: path
    editable: false
    unlock: "All logs, the Elasticsearch data and the certificates live there. Move the data folder yourself first, else T-Pot starts with an empty one."

  TPOT_OSTYPE:
    section: system
    title: OS type
    help: linux, or mac / win for Docker Desktop.
    type: text
    required: true
    safe: true
    editable: false
    widget: choice
    choices:
      - {value: linux, label: Linux}
      - {value: mac, label: macOS (Docker Desktop)}
      - {value: win, label: Windows (Docker Desktop)}
    unlock: "linux, mac or win. tpotinit compares it with the host and does not start when it does not match."
