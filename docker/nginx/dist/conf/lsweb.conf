############################################
### NGINX T-Pot configuration file by mo ###
############################################

### The capability probe of the SENSORs (/tpot-ingest) asks for the SENSOR's login after a limit per
### address: the first request of a SENSOR comes without it, a 401 with X-TPot-Ingest login tells it
### that this HIVE asks for its login (an older HIVE answers a plain 401). Only a request with a valid
### login reaches Logstash, and only Logstash's answer to it counts (its probe input,
### 11-input-sensors.conf)
limit_req_zone $binary_remote_addr zone=tpot_ingest:1m rate=1r/s;
map "$tpot_ingest_status:$tpot_ingest_mark" $tpot_ingest {
    "204:2"  "2";
    default  "";
}

server {

    #########################
    ### Basic server settings
    #########################
    listen 64294 ssl;
    http2 on;
    index index.html;
    ssl_protocols TLSv1.3;
    server_name example.com;
    error_page 300 301 302 400 401 402 403 404 500 501 502 503 504 /error.html;
    root /var/lib/nginx/html;
    add_header Cache-Control "public, max-age=604800";

    ##############################################
    ### Remove version number add different header
    ##############################################
    server_tokens off;


    ##############################################
    ### SSL settings and Cipher Suites
    ##############################################
    ssl_certificate /etc/nginx/cert/nginx.crt;
    ssl_certificate_key /etc/nginx/cert/nginx.key;

    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH:!DHE:!SHA:!SHA256';
    ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;


    ####################################
    ### OWASP recommendations / settings
    ####################################

    ### Size Limits & Buffer Overflows
    ### the size may be configured based on the needs.
    client_body_buffer_size  128k;
    client_header_buffer_size 1k;
    client_max_body_size 2M;
    
    ### Changed from OWASP recommendations: "2 1k" to "2 1280" (So 1.2k)
    ### When you pass though potentially another reverse proxy/load balancer
    ### in front of tpotce you can introduce more headers than normal and
    ### therefore you can exceed the allowed header buffer of 1k.
    ### An 280 extra bytes seems to be working for most use-cases.
    ### And still keeping it close to OWASP's recommendation.
    large_client_header_buffers 2 1280;

    ### Mitigate Slow HHTP DoS Attack
    ### Timeouts definition ##
    client_body_timeout   10;
    client_header_timeout 10;
    keepalive_timeout     5 5;
    send_timeout          10;

    ### X-Frame-Options is to prevent from clickJacking attack
    add_header X-Frame-Options SAMEORIGIN;

    ### disable content-type sniffing on some browsers.
    add_header X-Content-Type-Options nosniff;

    ### This header enables the Cross-site scripting (XSS) filter
    add_header X-XSS-Protection "1; mode=block";

    ### This will enforce HTTP browsing into HTTPS and avoid ssl stripping attack
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains;";
#    add_header 'Content-Security-Policy' 'upgrade-insecure-requests';

    ##################################
    ### Restrict access and basic auth
    ##################################

    # satisfy all;
    satisfy any;

    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    auth_basic           "closed site";
    auth_basic_user_file /etc/nginx/lswebpasswd;

    ################################################
    ### T-Pot Hive Logstash HTTP Input Reverse Proxy
    ################################################

    location / {
        set $logstash "http://logstash:64305";
        access_log off;
        error_log /var/log/nginx/lsweb_error.log;
        # a SENSOR sends batches of raw log lines (Fluent Bit), larger than the 2M of the server
        client_max_body_size 16M;
        # The sensor user that logged in, Logstash puts it into t-pot_sensor of every
        # event (Logstash 20-sensors.conf) - a header of that name sent by the client is replaced
        proxy_set_header X-TPot-Sensor $remote_user;
        proxy_pass $logstash;
    }

    ###########################################################################
    ### Capability probe of the SENSORs (E2): may this SENSOR send its format?
    ### 204 with X-TPot-Ingest 2 only while Logstash runs its sensors pipeline
    ### (the probe input on 64306, which drops its event), else 503 without it.
    ### GET / HEAD only (else 405), then the limit per address (429), then the
    ### SENSOR's login (no or a wrong one: 401 with X-TPot-Ingest login and no
    ### WWW-Authenticate). Nothing of the client goes to Logstash and nothing of
    ### Logstash's answer but the marker to the client.
    ###########################################################################

    location = /tpot-ingest {
        satisfy all;
        allow all;
        auth_basic "closed site";
        auth_basic_user_file /etc/nginx/lswebpasswd;
        access_log off;
        error_log /var/log/nginx/lsweb_error.log;
        limit_req zone=tpot_ingest burst=5 nodelay;
        limit_req_status 429;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        # the access phase runs allow, auth_basic, auth_request in this order: only a request with a
        # valid login makes the subrequest to Logstash
        auth_request /tpot-ingest-logstash;
        auth_request_set $tpot_ingest_status $upstream_status;
        auth_request_set $tpot_ingest_mark $upstream_http_x_tpot_ingest;
        # error_pages of its own: the ones of the server would go to Logstash through location /
        error_page 401 = @tpot_ingest_login;
        # the probe subrequest rewrites an upstream 403 to 502; auth_request reports that as 500
        error_page 500 = @tpot_ingest;
        # try_files runs after the access phase (auth_request); return would run before it
        try_files /tpot-ingest-none @tpot_ingest;
    }

    location @tpot_ingest_login {
        allow all;
        auth_basic off;
        access_log off;
        default_type text/plain;
        # auth_basic has set WWW-Authenticate, a SENSOR knows this HIVE by the marker instead
        more_clear_headers WWW-Authenticate;
        add_header X-TPot-Ingest login always;
        # a text of its own: neither the error page of nginx nor the one of the server (location /, Logstash)
        return 401 "login required\n";
    }

    location = /tpot-ingest-logstash {
        internal;
        set $logstash_probe "http://logstash:64306";
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        # an error_page of its own: a refused or unresolved probe port (an old Logstash, no Logstash)
        # would go to the error_page of the server, location / and the input of the events (64305);
        # a 401 / 403 of the probe port is not ready too (a 401 must not look like a refused login)
        proxy_intercept_errors on;
        error_page 401 403 500 502 503 504 = @tpot_ingest_down;
        proxy_pass $logstash_probe;
    }

    location @tpot_ingest_down {
        return 502;
    }

    location @tpot_ingest {
        allow all;
        auth_basic off;
        access_log off;
        default_type text/plain;
        # auth_request hands on the WWW-Authenticate of a 401 of the upstream
        more_clear_headers WWW-Authenticate;
        # a text of its own: an empty 503 would go to the error_page of the server (location /, Logstash)
        if ($tpot_ingest = "") {
            return 503 "ingest pipeline not ready\n";
        }
        add_header X-TPot-Ingest $tpot_ingest;
        return 204;
    }
}
