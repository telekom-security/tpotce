ports:
  tcp: 5000
  udp: 5001
  ssh: 64295
  # tpotinit owns all T-Pot firewall exceptions; never bypass host conntrack.
  ssh_notrack: false

rules_path: config/rules.yaml

addresses: []

producers:
  enabled: true
  http:
    enabled: false
    remote: https://localhost:9000
  hpfeeds:
    enabled: false
    host: 172.26.0.2
    port: 20000
    ident: ident
    auth: auth
    channel: test

conn_timeout: 45
max_tcp_payload: 4096
dial_timeout: 5

spicy:
  enabled: true

tpot:
  events: /var/log/glutton/glutton.log
