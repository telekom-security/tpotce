services:

# P0f service
  p0f:
    build: .
    container_name: p0f
    restart: always
#    cpu_count: 1
#    cpus: 0.75
    environment:
    # Capture interface, empty: automatic
     - TPOT_CAPTURE_INTERFACE=
    network_mode: "host"
    image: "dtagdevsec/p0f:24.04.2"
    read_only: true
    volumes:
     - $HOME/tpotce/data/p0f/log:/var/log/p0f
