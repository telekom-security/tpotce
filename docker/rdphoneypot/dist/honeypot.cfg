[honeypot]
sensor_name = t-pot
log_path = log
rss_path = responses
pem = cert/server.pem
listen_port = 3389
# connections from these networks are not logged (default: 127.0.0.1,192.168.0.0/16);
# T-Pot logs sources of every network (192.168.0.0/16 too), only 127.0.0.1 stays out
blacklist = 127.0.0.1

[output_jsonlog]
enabled = true
logfile = log/rdphoneypot.json
epoch_timestamp = false
