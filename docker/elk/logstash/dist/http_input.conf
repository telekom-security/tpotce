# Input section
input {
  http {
    id => "tpot"
    host => "0.0.0.0"
    port => "64305"
    ecs_compatibility => disabled
  }
}

# The sensor user nginx (lsweb.conf) authenticated, for `tpot sensors` to tell the
# sensors apart; events from 127.0.0.1 come without one
filter {
  ruby {
    path => "/usr/share/logstash/pipeline/sensor_heartbeat.rb"
  }
}

# Output section
output {
  if [type] == "TPotSensorHeartbeat" {
    # Fail closed even if a filter exception leaves a heartbeat uncancelled.
    if [@metadata][tpot_heartbeat] and "_rubyexception" not in [tags] {
      elasticsearch {
        id => "tpot_sensor_status"
        hosts => ["elasticsearch:9200"]
        index => "tpot-sensor-status"
        document_id => "%{[t-pot_sensor]}"
        action => "update"
        scripted_upsert => true
        retry_on_conflict => 5
        script => "
          if (ctx._source.heartbeat == null || ctx._source.heartbeat.received_at == null ||
              Instant.parse(ctx._source.heartbeat.received_at).compareTo(
                Instant.parse(params.event.heartbeat.received_at)) <= 0) {
            ctx._source = params.event;
          } else {
            ctx.op = 'noop';
          }
        "
        manage_template => false
        ilm_enabled => false
      }
      if [@metadata][tpot_heartbeat_history] {
        elasticsearch {
          id => "tpot_sensor_heartbeat_history"
          hosts => ["elasticsearch:9200"]
          index => "tpot-sensor-heartbeat-%{+YYYY.MM.dd}"
          manage_template => false
          ilm_enabled => false
        }
      }
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      # With templates now being legacy we need to set the daily index with its template manually. Otherwise a new index might be created with differents settings configured through Kibana.
      index => "logstash-%{+YYYY.MM.dd}"
      template => "/usr/share/logstash/config/tpot-template.json"
      template_overwrite => "true"
    }
  }
  # Syslog Output Example
  # syslog {
  #   host => "192.168.1.1"
  #   port => 514
  #   protocol => tcp
  #   appname => "logstash-logs"
  #   severity => "6"
  # }
}
