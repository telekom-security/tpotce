# The event of the capability probe (11-input-sensors.conf, port 64306) leaves no trace: no document,
# no status, no history. A sensor that sends the flag in its own body only drops its own event
filter {
  if [@metadata][tpot_probe] {
    drop {}
  }
}

# A body key @metadata becomes event metadata (json codec): drop what the sensor sent, so it cannot
# set routing flags; the http input itself sets no @metadata (ecs_compatibility disabled)
filter {
  mutate {
    remove_field => ["[@metadata]"]
  }
}

# The format of the request (E1): X-TPot-Ingest 2 is a SENSOR whose Fluent Bit sends the raw lines
# (the record's log, its type and t-pot fields); without it the events of a 24.04.1 SENSOR, which
# its Logstash already processed. Read from the request only, the body's @metadata is gone
filter {
  if [headers][x_tpot_ingest] == "2" {
    mutate {
      add_field => { "[@metadata][tpot_ingest]" => "2" }
    }
  }
}

# The sensor user nginx (lsweb.conf) authenticated, for `tpot sensors` to tell the
# sensors apart; events from 127.0.0.1 come without one
filter {
  ruby {
    path => "/usr/share/logstash/pipeline/sensor_heartbeat.rb"
  }
}

# Without an authenticated sensor name an event belongs to no sensor: it goes, in either format, with
# one warning a minute at most
filter {
  if ![t-pot_sensor] {
    ruby {
      init => "@warned_at = nil"
      code => '
        now = Time.now
        if @warned_at.nil? || now - @warned_at >= 60
          @warned_at = now
          logger.warn("Dropped sensor events without an authenticated sensor name (X-TPot-Sensor)")
        end
      '
    }
    drop {}
  }
}

# The request ballast of the http input: its headers and the remote address in host
filter {
  mutate {
    remove_field => ["headers", "host"]
  }
}

# The new format goes on to the processing pipeline (21-sensors-output.conf) with the raw line in
# message, as the files pipeline hands it; t-pot_log_path and the sensor's t-pot fields stay. The old
# format is refused: of each event only the sensor and the time of the refusal stay, and per sensor
# one a minute updates refused.last_at of its status (21-sensors-output.conf), the rest goes. The
# reduction comes first, so neither the sender's @timestamp nor its tags can steer the throttle
filter {
  if [@metadata][tpot_ingest] == "2" {
    mutate {
      rename => { "log" => "message" }
    }
  } else {
    ruby {
      code => '
        now = LogStash::Timestamp.now
        event.to_hash.keys.each { |key| event.remove(key) unless ["t-pot_sensor", "@timestamp"].include?(key) }
        event.timestamp = now
        event.set("[refused][last_at]", now.to_s)
      '
    }
    throttle {
      key => "%{[t-pot_sensor]}"
      after_count => 1
      period => 60
      max_age => 120
      add_tag => "throttled"
    }
    if "throttled" in [tags] {
      drop {}
    }
  }
}
