# Output section
output {
  # events that could not be parsed: the pipeline failures keeps them in tpot-failures-*; a document
  # Elasticsearch rejects goes into the dead letter queue of this pipeline, which it reads too
  if "_grokparsefailure" in [tags] or "_jsonparsefailure" in [tags] {
    pipeline { send_to => ["tpot_failures"] }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logstash-%{+YYYY.MM.dd}"
      # the index templates are tpotinit's (es_retention.sh), the entrypoint waits for them
      manage_template => false
    }
  }
