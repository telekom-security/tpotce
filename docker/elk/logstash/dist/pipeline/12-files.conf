# The events of the file inputs (10-input-files.conf; on a SENSOR the heartbeat of
# 13-input-heartbeat.conf too) get T-Pot's hostname and addresses here, so the processing
# pipeline reads no environment, and go on to it
filter {
  # The file inputs read ISO-8859-1 (one character per byte, 10-input-files.conf): the bytes of the file
  # again, as UTF-8; an invalid byte becomes U+FFFD, as in the line Fluent Bit sends from a SENSOR
  ruby {
    code => '
      message = event.get("message")
      if message.is_a?(String) && !message.ascii_only?
        event.set("message", message.encode(Encoding::ISO_8859_1).force_encoding(Encoding::UTF_8).scrub("\uFFFD"))
      end
    '
  }
  mutate {
    add_field => {
      "t-pot_ip_ext" => "${MY_EXTIP}"
      "t-pot_ip_int" => "${MY_INTIP}"
      "t-pot_hostname" => "${MY_HOSTNAME}"
    }
  }
}

output {
  pipeline {
    send_to => ["tpot_process"]
  }
}
