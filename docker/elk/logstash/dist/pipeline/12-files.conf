# The events of the file inputs (10-input-files.conf; on a SENSOR the heartbeat of
# 13-input-heartbeat.conf too) get T-Pot's hostname and addresses here, so the processing
# pipeline reads no environment, and go on to it
filter {
  mutate {
    add_field => {
      "t-pot_ip_ext" => "${MY_EXTIP}"
      "t-pot_ip_int" => "${MY_INTIP}"
      "t-pot_hostname" => "${MY_HOSTNAME}"
    }
  }
}

output {
  pipeline {
    send_to => ["tpot_process"]
  }
}
