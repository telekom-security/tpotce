filter {
# ElasticPot
  if [type] == "ElasticPot" {
    mutate {
      gsub => [
        "timestamp", "\+00:00Z$", "+00:00"
      ]
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    mutate {
      rename => {
        "content_type" => "http.http_content_type"
        "dst_port" => "dest_port"
        "dst_ip" => "dest_ip"
        "message" => "event_type"
        "request" => "request_method"
        "user_agent" => "http_user_agent"
	"url" => "http.url"
      }
    }
  }
}
