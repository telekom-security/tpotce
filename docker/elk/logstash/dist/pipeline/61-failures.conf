# Filter section: one document per failure. failure.stage is parse (the tags of the failure, the raw
# line) or index (the reason of the dead letter queue, the event as JSON without @metadata); of the
# event only @timestamp, type, t-pot_sensor, t-pot_hostname and t-pot_log_path stay.
filter {
  ruby {
    code => "
      reason = event.get('[@metadata][dead_letter_queue][reason]')
      if reason.nil?
        stage = 'parse'
        reason = Array(event.get('tags')).map(&:to_s).select { |tag| tag.end_with?('failure') }.join(',')
        original = event.get('message')
        original = event.to_json if original.nil?
      else
        stage = 'index'
        original = event.to_json
      end
      keep = ['@timestamp', 'type', 't-pot_sensor', 't-pot_hostname', 't-pot_log_path']
      event.to_hash.each_key { |key| event.remove(key) unless keep.include?(key) }
      event.set('[failure][stage]', stage)
      event.set('[failure][reason]', reason.to_s)
      event.set('[failure][original]', original.to_s)
    "
  }
}
