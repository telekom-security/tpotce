# Input section
input {
  http {
    id => "tpot"
    host => "0.0.0.0"
    port => "64305"
    ecs_compatibility => disabled
  }
  # The capability probe of a SENSOR (nginx lsweb.conf /tpot-ingest, E2): 204 with X-TPot-Ingest 2 only
  # while this pipeline runs, so a SENSOR sends its raw lines only to a HIVE that takes them. nginx asks
  # for the SENSOR's login before its probe reaches 64306: only a request with a valid login gets here.
  # Container network only (no compose file publishes 64306); 20-sensors.conf drops its event first
  http {
    id => "tpot_ingest_probe"
    host => "0.0.0.0"
    port => 64306
    response_code => 204
    response_headers => { "X-TPot-Ingest" => "2" }
    add_field => { "[@metadata][tpot_probe]" => "true" }
    ecs_compatibility => disabled
  }
}
