filter {
# Heralding
  if [type] == "Heralding" {
    csv {
      columns => ["timestamp","auth_id","session_id","src_ip","src_port","dest_ip","dest_port","proto","username","password","password_hash"] separator => ","
    }
    # Column order of the T-Pot fork (heralding/reporting/file_sink.py AUTH_FIELDS); it writes
    # a header row into an empty auth.csv (fresh start, logrotate). password_hash holds the
    # captured challenge response where the protocol sends no plain password (VNC, MySQL, NTLM ...)
    if [timestamp] == "timestamp" {
      drop {}
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSSSSS" ]
      remove_field => ["timestamp"]
    }
  }
}
