filter {
# Cowrie
  if [type] == "Cowrie" {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    mutate {
      rename => {
        "dst_port" => "dest_port"
        "dst_ip" => "dest_ip"
      }
    }
    if [duration_ms] {
      ruby {
        code => "event.set('session_seconds', event.get('duration_ms').to_f / 1000.0)"
      }
    }
  }
}
