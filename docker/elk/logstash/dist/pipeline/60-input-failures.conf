# Input section: the events the processing pipeline could not parse (address tpot_failures) and the
# documents Elasticsearch rejected, from the dead letter queue of the processing pipeline (default
# path.data)
input {
  pipeline { address => "tpot_failures" }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "process"
    commit_offsets => true
  }
}
