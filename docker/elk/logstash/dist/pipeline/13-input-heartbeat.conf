# Sensor reachability, separate from honeypot events on the HIVE.
input {
  heartbeat {
    id => "tpot_sensor_heartbeat"
    interval => 60
    sequence => "sequence"
    ecs_compatibility => disabled
    type => "TPotSensorHeartbeat"
    add_field => {
      "[heartbeat][version]" => "${MY_VERSION:}"
      "[heartbeat][started_at]" => "${TPOT_LOGSTASH_START}"
    }
  }
}

filter {
  if [type] == "TPotSensorHeartbeat" {
    mutate {
      rename => { "clock" => "[heartbeat][sequence]" }
      remove_field => ["host", "message"]
    }
  }
}
