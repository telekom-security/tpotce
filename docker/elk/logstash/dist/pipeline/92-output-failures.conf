# Output section: the failures in their own index (template tpot-failures of tpotinit, es_retention.sh)
output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "tpot-failures-%{+YYYY.MM.dd}"
    # the index templates are tpotinit's (es_retention.sh), the entrypoint waits for them
    manage_template => false
  }
}
