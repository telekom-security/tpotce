filter {
# Ddospot
  if [type] == "Ddospot" {
    if [path] == "/data/ddospot/log/targets.log" {
      mutate {
        replace => { "type" => "DdospotTarget" }
        add_field => { "dest_ip" => "%{[t-pot_ip_ext]}" }
      }
      date {
        match => [ "first_seen", "yyyy-MM-dd HH:mm:ss.SSSSSS" ]
        target => "first_seen"
      }
      date {
        match => [ "last_seen", "yyyy-MM-dd HH:mm:ss.SSSSSS" ]
        target => "last_seen"
      }
    }
    date {
      match => [ "time", "yyyy-MM-dd HH:mm:ss.SSSSSS" ]
      remove_field => ["time"]
    }
    if [path] == "/data/ddospot/log/chargenpot.log" {
      mutate {
        add_field => {
	  "dest_port" => "19"
          "dest_ip" => "%{[t-pot_ip_ext]}"
	}
      }
    }
    if [path] == "/data/ddospot/log/dnspot.log" {
      mutate {
        add_field => {
          "dest_port" => "53"
          "dest_ip" => "%{[t-pot_ip_ext]}"
        }
      }
    }
    if [path] == "/data/ddospot/log/ntpot.log" {
      mutate {
        add_field => {
          "dest_port" => "123"
          "dest_ip" => "%{[t-pot_ip_ext]}"
        }
      }
    }
    if [path] == "/data/ddospot/log/ssdpot.log" {
      mutate {
        add_field => {
          "dest_port" => "1900"
          "dest_ip" => "%{[t-pot_ip_ext]}"
        }
      }
    }
  }
}
