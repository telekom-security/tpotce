# Output section
output {
    # the former drop of events that could not be parsed, until the SENSOR ships raw lines
    if "_grokparsefailure" not in [tags] and "_jsonparsefailure" not in [tags] {
      http {
        http_method => "post"
        http_compression => true
        id => "${MY_HOSTNAME}"
        codec => "json"
        format => "json_batch"
        url => "https://${TPOT_HIVE_IP}:64294"
#      cacert => "/data/hive.crt"
        ssl_verification_mode => "${LS_SSL_VERIFICATION}"
        ssl_certificate_authorities => "/data/hive.crt"
        headers => {
          "Authorization" => "Basic ${TPOT_HIVE_USER}"
        }
      }
    }
}
