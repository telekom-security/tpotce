# Output section: a sensor's heartbeat of the new format into its status (and every fifth into the
# history), its other events into the processing pipeline (tpot_process); the old format only as
# refused.last_at in the status of its sensor (20-sensors.conf), nothing of it in another index
output {
  if [@metadata][tpot_ingest] == "2" {
    if [type] == "TPotSensorHeartbeat" {
      # Fail closed even if a filter exception leaves a heartbeat uncancelled.
      if [@metadata][tpot_heartbeat] and "_rubyexception" not in [tags] {
        elasticsearch {
          id => "tpot_sensor_status"
          hosts => ["elasticsearch:9200"]
          index => "tpot-sensor-status"
          document_id => "%{[t-pot_sensor]}"
          action => "update"
          scripted_upsert => true
          retry_on_conflict => 5
          # the sensor's newest time wins; a receipt 90 s after the stored one heals a clock that went back; the refusal of the old format stays
          script => "
            Instant sensorAt = Instant.parse(params.event['@timestamp']);
            Instant receivedAt = Instant.parse(params.event.heartbeat.received_at);
            boolean replace = true;
            try {
              def stored = ctx._source.heartbeat;
              if (stored != null && stored.received_at != null && ctx._source['@timestamp'] != null) {
                replace = Instant.parse(ctx._source['@timestamp']).compareTo(sensorAt) <= 0 ||
                  Instant.parse(stored.received_at).plusSeconds(90).isBefore(receivedAt);
              }
            } catch (Exception e) {
              replace = true;
            }
            if (replace) {
              def refused = ctx._source.refused;
              ctx._source = params.event;
              if (refused != null) {
                ctx._source.refused = refused;
              }
            } else {
              ctx.op = 'noop';
            }
          "
          manage_template => false
          ilm_enabled => false
        }
        if [@metadata][tpot_heartbeat_history] {
          elasticsearch {
            id => "tpot_sensor_heartbeat_history"
            hosts => ["elasticsearch:9200"]
            index => "tpot-sensor-heartbeat-%{+YYYY.MM.dd}"
            manage_template => false
            ilm_enabled => false
          }
        }
      }
    } else {
      pipeline { send_to => ["tpot_process"] }
    }
  } else {
    elasticsearch {
      id => "tpot_sensor_refused"
      hosts => ["elasticsearch:9200"]
      index => "tpot-sensor-status"
      document_id => "%{[t-pot_sensor]}"
      action => "update"
      scripted_upsert => true
      retry_on_conflict => 5
      # only refused (and the sensor of a new document): the heartbeat of the status stays
      script => "
        if (ctx.op == 'create') {
          ctx._source['t-pot_sensor'] = params.event['t-pot_sensor'];
        }
        ctx._source.refused = params.event.refused;
      "
      manage_template => false
      ilm_enabled => false
    }
  }
}
