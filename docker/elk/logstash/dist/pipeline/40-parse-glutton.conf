filter {
# Glutton
  if [type] == "Glutton" {
    if [event_kind] == "session" {
      date {
        match => [ "timestamp", "ISO8601" ]
        remove_field => ["timestamp"]
      }
      mutate {
        rename => {
          "srcHost" => "src_ip"
          "srcPort" => "src_port"
          "dstHost" => "dest_ip"
          "dstPort" => "dest_port"
          "srcPtr" => "[glutton][source_ptr]"
          "sensorVersion" => "[glutton][sensor_version]"
          "startedAt" => "[glutton][started_at]"
          "durationMs" => "[glutton][duration_ms]"
          "handlers" => "[glutton][handlers]"
          "payload" => "[glutton][payload]"
          "payloadHash" => "[glutton][payload_sha256]"
          "frameCount" => "[glutton][frame_count]"
          "endReason" => "[glutton][end_reason]"
          "scanner" => "[glutton][scanner]"
          "decoded" => "[glutton][decoded]"
          "tls" => "[glutton][tls]"
          "rule" => "[glutton][rule]"
          "ruleName" => "[glutton][rule_name]"
        }
      }
      ruby {
        code => '
          handlers = event.get("[glutton][handlers]")
          if handlers.is_a?(Array) && handlers.all? { |handler| handler.is_a?(String) }
            event.set("[glutton][protocol_stack]", handlers.join(" > "))
          end
          frames = event.get("[glutton][decoded]")
          if frames.is_a?(Array)
            commands = frames.filter_map { |frame| frame["command"] if frame.is_a?(Hash) && frame["command"].is_a?(String) }.uniq
            event.set("[glutton][commands]", commands) unless commands.empty?
          end
        '
      }
    } else if [time] {
      # Preserve events from existing installs while their old log is drained.
      date {
        match => [ "time", "ISO8601" ]
        remove_field => ["time"]
      }
    } else {
      date {
        match => [ "ts", "UNIX" ]
        remove_field => ["ts"]
      }
    }
  }
}
