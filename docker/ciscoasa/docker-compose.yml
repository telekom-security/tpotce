networks:
  ciscoasa_local:

services:

# Ciscoasa service
  ciscoasa:
    build: .
    container_name: ciscoasa
    restart: always
#    cpu_count: 1
#    cpus: 0.25
    networks:
     - ciscoasa_local
    ports:
     - "500:500/udp"
     - "4500:4500/udp"
     - "8443:8443"
    image: "dtagdevsec/ciscoasa:24.04.2"
    read_only: true
    volumes:
     - $HOME/tpotce/data/ciscoasa/log:/var/log/ciscoasa
     - $HOME/tpotce/data/ciscoasa/identity:/var/lib/ciscoasa
     - $HOME/tpotce/data/ciscoasa/payloads:/var/lib/ciscoasa/payloads
