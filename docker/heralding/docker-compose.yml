networks:
  heralding_local:

services:

# Heralding service
  heralding:
    build: .
    container_name: heralding
    restart: always
    tmpfs:
     - /tmp/heralding:uid=2000,gid=2000
#    cpu_count: 1
#    cpus: 0.25
    networks:
     - heralding_local
    ports:
     - "389:389"
     - "636:636"
     - "990:990"
     - "8883:8883"
     - "587:587"
     - "1433:1433"
     - "1883:1883"
     - "5060:5060"
     - "5060:5060/udp"
     - "6379:6379"
     - "8080:8080"
     - "445:445"
     - "21:21"
     - "22:22"
     - "23:23"
     - "25:25"
     - "80:80"
     - "110:110"
     - "143:143"
     - "443:443"
     - "465:465"
     - "993:993"
     - "995:995"
     - "1080:1080"
     - "3306:3306"
     - "3389:3389"
     - "5432:5432"
     - "5900:5900"
    image: "dtagdevsec/heralding:24.04.2"
    read_only: true
    volumes:
     - $HOME/tpotce/data/heralding/log:/var/log/heralding
