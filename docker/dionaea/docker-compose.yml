networks:
  dionaea_local:

services:

# Dionaea service
  dionaea:
    build: .
    container_name: dionaea
    restart: always
    environment:
     - DIONAEA_STREAMDUMPER_MAX_SIZE=${DIONAEA_BISTREAMS_MAX_MB:-2048}
     - DIONAEA_STREAMDUMPER_MAX_FILES=${DIONAEA_BISTREAMS_MAX_FILES:-200000}
     - DIONAEA_STORE_MAX_SIZE=${DIONAEA_BINARIES_MAX_MB:-1024}
    networks:
     - dionaea_local
    ports:
     - "20:20"
     - "21:21"
     - "42:42"
     - "69:69/udp"
     - "81:81"
     - "135:135"
     - "443:443"
     - "445:445"
     - "1433:1433"
     - "1723:1723"
     - "1883:1883"
     - "3306:3306"
#     - "5060:5060"
#     - "5060:5060/udp"
#     - "5061:5061"
     - "27017:27017"
    image: "dtagdevsec/dionaea:24.04.2"
    read_only: true
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    cpus: 1
    tmpfs:
     - /tmp:uid=2000,gid=2000,size=16m
    volumes:
     - $HOME/tpotce/data/dionaea/roots/ftp:/opt/dionaea/var/dionaea/roots/ftp:ro
     - $HOME/tpotce/data/dionaea/roots/tftp:/opt/dionaea/var/dionaea/roots/tftp:ro
     - $HOME/tpotce/data/dionaea/roots/www:/opt/dionaea/var/dionaea/roots/www:ro
     - $HOME/tpotce/data/dionaea/roots/upnp:/opt/dionaea/var/dionaea/roots/upnp:ro
     - $HOME/tpotce/data/dionaea:/opt/dionaea/var/dionaea
     - $HOME/tpotce/data/dionaea/binaries:/opt/dionaea/var/dionaea/binaries
     - $HOME/tpotce/data/dionaea/log:/opt/dionaea/var/log
     - $HOME/tpotce/data/dionaea/rtp:/opt/dionaea/var/dionaea/rtp

