# ---------------------------------------------------------------------------
# Smart meter
# ---------------------------------------------------------------------------
[templates.kamstrup_382]
deploy = true

[templates.kamstrup_382.template]
unit = "382"
vendor = "Kamstrup"
description = "Kamstrup 382 electricity meter"
protocols = ["kamstrup_management", "kamstrup_meter"]
creator = "T-Pot"

[templates.kamstrup_382.set."template.toml"]
# T-Pot values since 24.04
"core.databus.key_value_mappings.kap_a_server_hostname" = { value = "'pwr_ctrl_mgmt01.int.local'" }
"core.databus.key_value_mappings.kap_a_server_ip" = { value = "'10.232.15.242'" }
# upstream defaults
"core.databus.key_value_mappings.mac_address" = { value = "'@@MAC@@'" }
"core.databus.key_value_mappings.ip_addr" = { value = "'@@LAN_IP@@'" }
"core.databus.key_value_mappings.ip_gateway" = { value = "'@@LAN_GW@@'" }
"core.databus.key_value_mappings.channel_a_meternumber" = { value = "'@@METERNUMBER@@'" }
"core.databus.key_value_mappings.channel_b_meternumber" = { value = "'@@METERNUMBER@@'" }
"core.databus.key_value_mappings.register_1001" = { value = "@@SERIAL@@" }
"core.databus.key_value_mappings.register_1010" = { value = "@@SERIAL@@" }

[templates.kamstrup_382.set."kamstrup_meter.toml"]
"kamstrup_meter.login_pin" = "@@LOGIN_PIN@@"

[templates.kamstrup_382.identity]
LAN_IP = { gen = "lan_ip" }
LAN_GW = { derive = "ip_gateway", of = "LAN_IP" }
MAC = { gen = "mac", oui = "00:13:EA" }
SERIAL = { gen = "digits", n = 8 }
METER_ID = { gen = "hexbytes", n = 3 }
METERNUMBER = { derive = "format", of = "METER_ID", fmt = "A1 06 A1 02 {} 00 00 03" }
LOGIN_PIN = { gen = "int", min = 10000, max = 99999 }

# ---------------------------------------------------------------------------
# Beckhoff Embedded PC CX5140 (Win10 IoT LTSC 2019, TwinCAT 3.1.4024): ADS, OPC UA
# Hostname CX-<last 3 MAC bytes>, AMS NetID <IP>.1.1, TF6100 OPC UA server naming
# ---------------------------------------------------------------------------
[templates.beckhoff_cx]
deploy = true
base = "ads"
include = { "opcua.toml" = "opcua/opcua.toml" }

[templates.beckhoff_cx.template]
unit = "CX5140"
vendor = "Beckhoff Automation"
description = "Embedded PC, TwinCAT 3 PLC runtime with ADS and TwinCAT OPC UA Server"
protocols = ["ads", "opcua"]
creator = "T-Pot"

[templates.beckhoff_cx.set."ads.toml"]
"ads.ams_net_id" = "@@AMS_NET_ID@@"
"ads.device_name" = "Plc30 App"
"ads.version_build" = 4024
"ads.hostname" = "@@HOSTNAME@@"
"ads.tc_version_build" = 4024
"ads.os_build" = 17763

[templates.beckhoff_cx.set."opcua.toml"]
"opcua.endpoint_path" = "/"
"opcua.server_name" = "TcOpcUaServer@@@HOSTNAME@@"
"opcua.namespace_uri" = "urn:BeckhoffAutomation:Ua:PLC1"
"opcua.application_uri" = "urn:@@HOSTNAME@@:BeckhoffAutomation:TcOpcUaServer"
"opcua.variables" = [
    { name = "MAIN.fTemperature", type = "float", value = 21.4 },
    { name = "MAIN.fPressure", type = "float", value = 3.82 },
    { name = "MAIN.bPumpRunning", type = "boolean", value = true },
    { name = "MAIN.nBatchId", type = "integer", value = 1187 },
]

[templates.beckhoff_cx.add."opcua.toml"]
"opcua.endpoint_host" = "@@HOSTNAME@@"
"opcua.folder_name" = "PLC1"
"opcua.product_uri" = "urn:BeckhoffAutomation:TcOpcUaServer"
"opcua.manufacturer_name" = "Beckhoff Automation"
"opcua.product_name" = "TwinCAT OPC UA Server"
"opcua.software_version" = "5.1.120"
"opcua.build_number" = "120"

[templates.beckhoff_cx.identity]
LAN_IP = { gen = "lan_ip" }
AMS_NET_ID = { derive = "ip_suffix", of = "LAN_IP", suffix = ".1.1" }
MAC = { gen = "mac", oui = "00:01:05" }
HOST_SUFFIX = { derive = "mac_tail", of = "MAC" }
HOSTNAME = { derive = "format", of = "HOST_SUFFIX", fmt = "CX-{}" }

