# T-Pot overrides for the upstream Conpot templates, applied by tpot_templates.py.
#
#   base     upstream template to copy from (default: same name, edited in place)
#   include  { "<file in template>" = "<upstream template>/<file>" }
#   template replaces [core.template]; its protocols must match the <proto>.toml files
#   set      { "<file>" = { "dotted.key.path" = value } }, the path must exist upstream
#   add      like set, for keys that must not exist upstream yet
#   replace  { "<file>" = { "literal" = "replacement" } }, the literal must occur
#   identity per-install values, generated on first start and kept in /var/lib/conpot
#            gen: lan_ip | mac (oui) | digits (n) | hex (n, upper) | hexbytes (n) | int (min, max) | choice (values)
#            derive (from "of"): mac_tail | mac_hex | mac_plain | ip_gateway | ip_suffix | format
#
# "@@TOKEN@@" in quotes becomes a typed TOML value, @@TOKEN@@ inside a string its text.
# Only templates with deploy = true are checked against the guard list.

[guard]
deny = [
    "conpot",
    "technodrome",
    "mouser",
    "venus",
    "statoil",
    "evilpowerprovider",
    "163.172.189.137",
    "202.202.202.1",
    "freeopcua",
    "compagnie generale des eaux",
    "@@",
]

# ---------------------------------------------------------------------------
# Substation RTU: IEC 60870-5-104, DNP3, SNMP
# ---------------------------------------------------------------------------
[templates.IEC104]
deploy = true
include = { "dnp3.toml" = "dnp3/dnp3.toml" }

[templates.IEC104.template]
unit = "S7-300"
vendor = "Siemens"
description = "S7-300 telecontrol station, CP 343-1 (IEC 60870-5-104) and TIM 3V-IE DNP3"
protocols = ["IEC104", "dnp3", "snmp"]
creator = "T-Pot"

[templates.IEC104.set."template.toml"]
# T-Pot values since 24.04
"core.databus.key_value_mappings.sysContact" = "Corporate IT"
"core.databus.key_value_mappings.sysName" = "DE-BER01"
"core.databus.key_value_mappings.sysLocation" = "BER01, T2E"
# upstream defaults
"core.databus.key_value_mappings.FacilityName" = "BER01 Substation"
"core.databus.key_value_mappings.ifPhysAddress" = "@@MAC_HEX@@"
"core.databus.key_value_mappings.ipAdEntAddr" = "@@LAN_IP@@"
"core.databus.key_value_mappings.ipAdEntNetMask" = "255.255.255.0"
"core.databus.key_value_mappings.tcpConnLocalAddress" = "@@LAN_IP@@"
"core.databus.key_value_mappings.udpLocalAddress" = "@@LAN_IP@@"
"core.databus.key_value_mappings.CommonAddress" = "@@COMMON_ADDRESS@@"

[templates.IEC104.set."snmp.toml"]
"snmp.port" = 161

[templates.IEC104.set."dnp3.toml"]
"dnp3.outstation_address" = "@@DNP3_ADDRESS@@"
"dnp3.device_info.vendor_name" = "SIEMENS AG"
"dnp3.device_info.product_code" = "6NH7803-3BA00-0AA0"

[templates.IEC104.replace."snmp.toml"]
"163.172.189.137" = "@@LAN_IP@@"

[templates.IEC104.identity]
LAN_IP = { gen = "lan_ip" }
MAC = { gen = "mac", oui = "00:0E:8C" }
MAC_HEX = { derive = "mac_hex", of = "MAC" }
COMMON = { gen = "int", min = 1, max = 9999 }
COMMON_ADDRESS = { derive = "format", of = "COMMON", fmt = "0x{:04x}" }
DNP3_ADDRESS = { gen = "int", min = 1, max = 254 }

