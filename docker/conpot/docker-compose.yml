# CONPOT TEMPLATE=[default, IEC104, guardian_ast, ipmi, kamstrup_382, beckhoff_cx, building_automation, hart_gateway, iccp, plc_modbus, proxy]
networks:
  conpot_local_default:
  conpot_local_IEC104:
  conpot_local_guardian_ast:
  conpot_local_ipmi:
  conpot_local_kamstrup_382:
  conpot_local_ics:

services:

# Conpot default service
  conpot_default:
    build: .
    container_name: conpot_default
    restart: always
    environment:
     - CONPOT_CONFIG=/etc/conpot/conpot.cfg
     - CONPOT_JSON_LOG=/var/log/conpot/conpot_default.json
     - CONPOT_LOG=/var/log/conpot/conpot_default.log
     - CONPOT_TEMPLATE=default
     - CONPOT_TMP=/tmp/conpot
    tmpfs:
     - /tmp/conpot:uid=2000,gid=2000
#    cpu_count: 1
#    cpus: 0.25    
    networks:
     - conpot_local_default
    # 102, 161/udp, 502, 623/udp and 47808/udp are used by the other templates below
    ports:
#     - "69:69/udp"
     - "80:80"
#     - "102:102"
#     - "161:161/udp"
#     - "502:502"
#     - "623:623/udp"
     - "2121:21"
     - "44818:44818"
#     - "47808:47808/udp"
    image: "dtagdevsec/conpot:24.04.2"
    read_only: true
    volumes:
     - $HOME/tpotce/data/conpot/log:/var/log/conpot
     - $HOME/tpotce/data/conpot/identity:/var/lib/conpot

