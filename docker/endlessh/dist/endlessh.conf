# Delay, Jitter, MaxLineLength and the BannerFile (lines from banner_corpus.txt)
# differ per install: run.sh chooses them on the first start and keeps them in
# /var/lib/endlessh/identity.conf, which is read before this file. A key set
# here wins over it.

# The port on which to listen for new SSH connections.
Port 2222

# Maximum number of connections to accept at a time. Connections beyond
# this are not immediately rejected, but will wait in the queue.
MaxClients 4096

# Set the detail level for the log.
#   0 = Quiet
#   1 = Standard, useful log messages
#   2 = Very noisy debugging information
LogLevel 1

# Set the family of the listening socket
#   0 = Use IPv4 Mapped IPv6 (Both v4 and v6, default)
#   4 = Use IPv4 only
#   6 = Use IPv6 only
BindFamily 4
