---
###########################
# T-Pot Sensor Deployment #
###########################

- name: T-POT Sensor Deployment
  hosts: all
  vars:
    local_nginx_cert_path: "~/tpotce/data/nginx/cert/nginx.crt"
    remote_cert_path: "~/tpotce/data/hive.crt"
    remote_sensor_yml_path: "~/tpotce/compose/sensor.yml"
    remote_docker_compose_path: "~/tpotce/docker-compose.yml"
    remote_generated_path: "~/tpotce/tpotctl/generated.py"
    env_file_path: "~/tpotce/.env"

  tasks:
    - name: Check the runtime configuration exists on the sensor
      ansible.builtin.stat:
        path: "{{ env_file_path }}"
      register: my_sensor_env

    - name: Refuse to create an incomplete sensor configuration
      ansible.builtin.assert:
        that:
          - my_sensor_env.stat.exists
          - my_sensor_env.stat.isreg
        fail_msg: "The sensor has no complete ~/tpotce/.env. Install or update T-Pot on the sensor first."

    - name: Look for generated configuration support on the sensor
      ansible.builtin.stat:
        path: "{{ remote_generated_path }}"
      register: my_sensor_generated

    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "{{ remote_cert_path | dirname }}"
        state: directory
        mode: '770'

    - name: Copy nginx.crt from local to remote host
      ansible.builtin.copy:
        src: "{{ local_nginx_cert_path }}"
        dest: "{{ remote_cert_path }}"

    - name: Look for sudo-rs on the sensor
      # Ubuntu 26.04 makes sudo-rs the active `sudo`. It wraps the prompt it is
      # given with `-p`, so Ansible does not recognise it and the become below
      # times out. The traditional sudo is still shipped next to it, and every
      # task up to here runs without become, so this can be settled here.
      ansible.builtin.shell: |
        if sudo --version 2>&1 | grep -qi sudo-rs && [ -x /usr/bin/sudo.ws ];
          then
            echo /usr/bin/sudo.ws
        fi
      args:
        executable: /bin/bash
      register: my_sudo_ws
      changed_when: false
      failed_when: false

    - name: Use the traditional sudo for become on the sensor
      ansible.builtin.set_fact:
        ansible_become_exe: "{{ my_sudo_ws.stdout | trim }}"
      when: my_sudo_ws.stdout | trim | length > 0

    - name: Stop T-Pot with the compose file of the previous edition
      # The service removes the containers of the compose file in place. Once
      # sensor.yml replaced it, the services of a HIVE (Elasticsearch, Kibana,
      # nginx, ...) would be left running as orphans after the reboot.
      become: yes
      ansible.builtin.systemd:
        name: tpot.service
        state: stopped
      failed_when: false

    - name: Put the sensor compose file in place
      # A SENSOR compose file of compose/customizer.py is rebuilt from its header
      # (as update.sh fuRESTORE_CUSTOM does), one edited by hand or that cannot be
      # rebuilt is kept; anything else becomes sensor.yml. Its first line says
      # what happened. Lines above the header are not in the rebuilt file, so
      # they are kept in a copy first (rebuilt-kept, then the copy on a line of
      # its own: its path may hold a space).
      ansible.builtin.shell: |
        mySENSOR="{{ remote_sensor_yml_path }}"
        mySENSOR="${mySENSOR/#\~/$HOME}"
        myCOMPOSE="{{ remote_docker_compose_path }}"
        myCOMPOSE="${myCOMPOSE/#\~/$HOME}"
        myCUSTOMIZER=~/tpotce/compose/customizer.py
        myTMP=""
        trap '[ -n "${myTMP}" ] && rm -f "${myTMP}"' EXIT
        myLINE=$(awk '/^[[:space:]]*$/ { next } !/^[[:space:]]*#/ { exit } /^# T-Pot:/ { sub(/^# T-Pot:[[:space:]]*/, ""); sub(/[[:space:]]+$/, ""); print NR " " $0; exit }' "${myCOMPOSE}" 2>/dev/null)
        myHEADER=""
        if [ "${myLINE#* }" == "CUSTOM" ];
          then
            myHEADER=$(sed -n "$((${myLINE%% *} + 1))p" "${myCOMPOSE}")
        fi
        if [[ ! "${myHEADER}" =~ ^"# customizer: version=" ]] || [[ ! " ${myHEADER} " =~ " base=SENSOR " ]];
          then
            cp "${mySENSOR}" "${myCOMPOSE}" || exit 1
            echo copied
            exit 0
        fi
        mySUM=$(sed -n 's/^# customizer: sha256=\([0-9a-f]\{64\}\)$/\1/p' "${myCOMPOSE}" | head -1)
        if [ -z "${mySUM}" ] || [ "$(sed '1,/^# customizer: sha256=/d' "${myCOMPOSE}" | sha256sum | awk '{ print $1 }')" != "${mySUM}" ];
          then
            echo kept-edited
            exit 0
        fi
        myKEPT=""
        if head -n "$(( ${myLINE%% *} - 1 ))" "${myCOMPOSE}" | grep -q "[^[:space:]]";
          then
            myKEPT="$HOME/tpot_backups/docker-compose_sensor_$(date +%Y%m%d%H%M%S).yml"
            if ! { mkdir -p "$HOME/tpot_backups" && cp "${myCOMPOSE}" "${myKEPT}"; } >&2;
              then
                rm -f "${myKEPT}"
                echo kept-failed
                exit 0
            fi
        fi
        myPYTHON="${XDG_DATA_HOME:-$HOME/.local/share}/tpotce/venv/bin/python3"
        [ -x "${myPYTHON}" ] || myPYTHON="python3"
        if myTMP=$(mktemp "$(dirname "${myCOMPOSE}")/.docker-compose.XXXXXX") \
           && "${myPYTHON}" "${myCUSTOMIZER}" --rebuild "${myCOMPOSE}" -o "${myTMP}" </dev/null >&2 \
           && [ -s "${myTMP}" ] \
           && mv -f "${myTMP}" "${myCOMPOSE}";
          then
            myTMP=""
            if [ -n "${myKEPT}" ];
              then
                printf 'rebuilt-kept\n%s\n' "${myKEPT}"
              else
                echo rebuilt
            fi
          else
            echo kept-failed
        fi
      args:
        executable: /bin/bash
      register: my_sensor_compose
      changed_when: (my_sensor_compose.stdout.split() | first | default('')) in ['rebuilt', 'rebuilt-kept', 'copied']

    - name: Warn that the compose file of the sensor was kept
      ansible.builtin.debug:
        msg: >-
          {{ 'The sensor deployment kept the docker-compose.yml of the sensor, it was edited by hand; T-Pot runs it as it is.'
             if (my_sensor_compose.stdout.split() | first | default('')) == 'kept-edited' else
             'The sensor deployment kept the docker-compose.yml of the sensor, it could not be rebuilt; T-Pot runs it as it is.' }}
      when: (my_sensor_compose.stdout.split() | first | default('')) in ['kept-edited', 'kept-failed']

    - name: Warn that the lines above the customizer header were kept in a copy
      ansible.builtin.debug:
        msg: "The lines above '# T-Pot: CUSTOM' in the docker-compose.yml of the sensor are not in the rebuilt one, they are kept in {{ my_sensor_compose.stdout_lines[1] }}."
      when: (my_sensor_compose.stdout.split() | first | default('')) == 'rebuilt-kept'

    - name: Stamp the generated compose file on the sensor
      ansible.builtin.command:
        argv:
          - python3
          - "{{ remote_generated_path }}"
          - stamp-compose
          - --file
          - "{{ remote_docker_compose_path }}"
          - --root
          - "~/tpotce"
      when:
        - my_sensor_generated.stat.isreg | default(false)
        - (my_sensor_compose.stdout.split() | first | default('')) in ['rebuilt', 'rebuilt-kept', 'copied']

    - name: Explain compatibility with an older sensor
      ansible.builtin.debug:
        msg: "This sensor predates generated configuration; update T-Pot on it to enable source fingerprints."
      when: not (my_sensor_generated.stat.isreg | default(false))

    - name: Update T-POT_HIVE_USER in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^TPOT_HIVE_USER='
        line: 'TPOT_HIVE_USER={{ lookup("env", "myTPOT_HIVE_USER") }}'

    - name: Update T-POT_HIVE_IP in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^TPOT_HIVE_IP='
        line: 'TPOT_HIVE_IP={{ lookup("env", "myTPOT_HIVE_IP") }}'

    - name: Ensure T-POT_TYPE is set to SENSOR in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^TPOT_TYPE='
        line: 'TPOT_TYPE=SENSOR'

    - name: Ensure WEB_USER is empty in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^WEB_USER='
        line: 'WEB_USER='

    - name: Ensure LS_WEB_USER is empty in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^LS_WEB_USER='
        line: 'LS_WEB_USER='

    - name: Reboot the sensor
      become: yes
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 0
        msg: "Reboot initiated by Ansible for T-Pot sensor deployment."
        test_command: "uptime"
