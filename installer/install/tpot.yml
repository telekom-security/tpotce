---
################################
# T-Pot - Bootstrapping Python #
################################

- name: T-Pot - Bootstrapping Python
  hosts: all
  gather_facts: false
  become: true
  become_method: sudo

  tasks:
    - name: Get distribution name (All)
      raw: awk -F= '/^NAME/{print $2}' /etc/os-release | tr -d '"' | cut -d " " -f1
      register: my_distribution
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Check if python3 is installed (All)
      raw: echo $(command -v python3)
      register: my_python3
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Add python package (Debian, Raspbian, Ubuntu)
      raw: |
        apt update
        apt -y install python3
      when: my_distribution.stdout | trim in ["Debian", "Raspbian", "Ubuntu"] and my_python3.stdout | trim == ""
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Add python package (Alma, Fedora, RHEL, Rocky)
      raw: |
        dnf -y --refresh install python3
      when: my_distribution.stdout | trim in ["AlmaLinux", "Fedora", "RedHat", "Rocky"] and my_python3.stdout | trim == ""
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "RedHat"
        - "Rocky"

    - name: Add python package (openSUSE Tumbleweed)
      raw: |
        zypper refresh
        zypper -y install python3
      when: my_distribution.stdout | trim in ["AlmaLinux", "Fedora", "Rocky"] and my_python3.stdout | trim == ""
      tags:
        - "openSUSE Tumbleweed"

#####################################################################
# T-Pot - Abort if run as tpot, root or on unsupported distribution #
#####################################################################

- name: T-Pot - Abort if run as tpot, root or on unsupported distribution
  hosts: all
  gather_facts: true
  become: false
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

  tasks:
    - name: Check if running as root (All)
      assert:
        that: ansible_facts.user_id != 'root'
        fail_msg: "T-Pot playbook should not be run as root."
        success_msg: "Running as user: {{ ansible_facts.user_id }}."

    - name: Check if running as tpot (All)
      assert:
        that: ansible_facts.user_id != 'tpot'
        fail_msg: "Reserved username `tpot` detected."
        success_msg: "Running as user: {{ ansible_facts.user_id }}."

    - name: Check if supported distribution (All)
      assert:
        that: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
        fail_msg: "T-Pot is not supported on this platform: {{ ansible_facts.distribution }}."
        success_msg: "T-Pot will now install on {{ ansible_facts.distribution }}."

    - name: Check if supported distribution version (All)
      # T-Pot follows the current release of each distribution, the packages and
      # repositories it uses are only available there. openSUSE Tumbleweed rolls
      # and is not listed, so the check skips it.
      assert:
        that: my_current_version == my_supported_version[ansible_facts.distribution]
        fail_msg: "T-Pot supports {{ ansible_facts.distribution }} {{ my_supported_version[ansible_facts.distribution] }}, this system runs {{ my_current_version }}."
        success_msg: "T-Pot will now install on {{ ansible_facts.distribution }} {{ my_current_version }}."
      vars:
        my_supported_version:
          AlmaLinux: "10"
          Debian: "13"
          Fedora: "44"
          Raspbian: "13"
          RedHat: "10"
          Rocky: "10"
          Ubuntu: "26.04"
        # Ubuntu is identified by major and minor, every other one by major
        my_current_version: "{{ ansible_facts.distribution_version if ansible_facts.distribution == 'Ubuntu' else ansible_facts.distribution_major_version }}"
      when: ansible_facts.distribution in my_supported_version

    - name: Count default routes (All)
      ansible.builtin.shell: ip route show default | wc -l
      args:
        executable: /bin/bash
      register: my_default_routes
      changed_when: false
      failed_when: false

    - name: Warn about multiple default routes (All)
      debug:
        msg: |
          WARNING: {{ my_default_routes.stdout | trim }} default routes detected.
          fatt, p0f and suricata derive their capture interface from the default
          route and cannot handle more than one name, they will restart-loop.
      when: my_default_routes.stdout | trim != "1"

############################################################
# T-Pot - Install recommended, remove conflicting packages #
############################################################

- name: T-Pot - Install recommended, remove conflicting packages 
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Syncing clocks (All)
      shell: "hwclock --hctosys"
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      ignore_errors: true
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Install cron without recommends (Debian, Raspbian, Ubuntu)
      ansible.builtin.apt:
        name: cron
        state: present
        install_recommends: no
        update_cache: yes
      when: ansible_facts.distribution in ["Debian", "Raspbian", "Ubuntu"]
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Install recommended packages (Debian, Raspbian, Ubuntu)
      package:
        name:
          - apache2-utils
          - bash-completion
          - ca-certificates
          - cracklib-runtime
          - cron
          - curl
          - git
          - gnupg
          - grc
          - htop
          - micro
          - net-tools
          - vim
          - wget
        state: latest
        update_cache: yes
      when: ansible_facts.distribution in ["Debian", "Raspbian", "Ubuntu"]
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Install grc from remote repo (AlmaLinux, Rocky)
      ansible.builtin.dnf:
        name: 'https://github.com/kriipke/grc/releases/download/1.13.8/grc-1.13.8-1.el7.noarch.rpm'
        disable_gpg_check: true
        state: present
      when: ansible_facts.distribution in ["AlmaLinux", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Rocky"

    - name: Install recommended packages (AlmaLinux, Rocky)
      package:
        name:
          - bash-completion
          - ca-certificates
          - cracklib
          - curl
          - dnf-plugins-core
          - git
          - grc
          - htop
          - httpd-tools
          - net-tools
          - tar
          - vim
          - wget
        state: latest
        update_cache: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Rocky"

    - name: Download and install micro editor (AlmaLinux, openSUSE Tumbleweed, RHEL, Rocky)
      shell: "curl https://getmic.ro | bash && mv micro /usr/bin"
      args:
        executable: /bin/bash
      when: ansible_facts.distribution in ["AlmaLinux", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Install recommended packages (Fedora)
      package:
        name:
          - bash-completion
          - ca-certificates
          - cracklib
          - cronie
          - curl
          - dnf-plugins-core
          - git
          - grc
          - htop
          - httpd-tools
          - micro
          - net-tools
          - vim
          - wget
        state: latest
        update_cache: yes
      when: ansible_facts.distribution in ["Fedora"]
      tags:
        - "Fedora"

    - name: Remove conflicting packages (openSUSE Tumbleweed)
      package:
        name:
          - cups
          - net-tools
          - postfix
          - yast2-auth-client
          - yast2-auth-user
        state: absent
        update_cache: yes
      when: ansible_facts.distribution in ["openSUSE Tumbleweed"]
      tags:
        - "openSUSE Tumbleweed"

    - name: Install recommended packages (openSUSE Tumbleweed)
      package:
        name:
          - apache2-utils
          - bash-completion
          - busybox-net-tools
          - ca-certificates
          - cracklib
          - curl
          - git
          - grc
          - htop
          - vim
          - wget
        state: latest
        update_cache: yes
      when: ansible_facts.distribution in ["openSUSE Tumbleweed"]
      tags:
        - "openSUSE Tumbleweed"

#####################################
# T-Pot - Prepare for Docker Engine #
#####################################

- name: T-Pot - Prepare for and install Docker Engine
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Remove distribution based Docker packages and podman-docker (AlmaLinux, Debian, Fedora, Raspbian, RHEL, Rocky, Ubuntu)
      package:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
          - podman-docker
          - podman
        state: absent
        update_cache: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Add folder for Docker Engine GPG key (Debian, Raspbian, Ubuntu)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: 0755
      when: ansible_facts.distribution in ["Debian", "Raspbian", "Ubuntu"]
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Download Docker Engine GPG key (Debian, Raspbian, Ubuntu)
      get_url:
        url: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
        dest: /etc/apt/keyrings/docker
        mode: 0755
      when: ansible_facts.distribution in ["Debian", "Raspbian", "Ubuntu"]
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Decrypt Docker Engine GPG key (Debian, Raspbian, Ubuntu)
      shell: gpg --dearmor /etc/apt/keyrings/docker
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when: ansible_facts.distribution in ["Debian", "Raspbian", "Ubuntu"]
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Add Docker Engine repository (Debian, Raspbian, Ubuntu)
      apt_repository:
        filename: docker
        repo: "deb [arch={{ ansible_facts.architecture | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_facts.distribution | lower }} {{ ansible_facts.distribution_release }} stable"
        state: present
        update_cache: yes
      when: ansible_facts.distribution in ["Debian", "Raspbian", "Ubuntu"]
      tags:
        - "Debian"
        - "Raspbian"
        - "Ubuntu"

    - name: Add Docker repository (Fedora)
      # `addrepo` is dnf5 syntax, Fedora 44 ships dnf5
      shell: |
        if [ "$(dnf repolist docker-ce-stable)" == "" ];
          then
            dnf -y config-manager addrepo --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
        fi
      when: ansible_facts.distribution in ["Fedora"]
      tags:
        - "Fedora"

    - name: Add Docker repository (RHEL)
      # RHEL 10 ships dnf 4, whose config-manager only knows `--add-repo` - the
      # dnf5 `addrepo` subcommand fails there with "unrecognized arguments"
      shell: |
        if [ "$(dnf repolist docker-ce-stable)" == "" ];
          then
            dnf -y config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
        fi
      when: ansible_facts.distribution in ["RedHat"]
      tags:
        - "RedHat"

    - name: Add Docker repository (AlmaLinux, Rocky)
      # deliberately the centos repository: download.docker.com/linux/alma and
      # /rocky do exist, but they only carry containerd.io and the plugins, not
      # docker-ce and docker-ce-cli. Same dnf 4 syntax as RHEL above.
      shell: |
        if [ "$(dnf repolist docker-ce-stable)" == "" ];
          then
            dnf -y config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
        fi
      when: ansible_facts.distribution in ["AlmaLinux", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Rocky"


#################################
# T-Pot - Install Docker Engine #
#################################

- name: T-Pot - Install Docker Engine
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Install Docker Engine packages (openSUSE Tumbleweed)
      package:
        name:
          - docker
          - docker-bash-completion
          - docker-buildx
          - docker-compose
          - docker-compose-switch
          - liblvm2cmd2_03
          - lvm2
        state: latest
        update_cache: yes
      when: ansible_facts.distribution in ["openSUSE Tumbleweed"]
      tags:
        - "openSUSE Tumbleweed"

    - name: Install Docker Engine packages (AlmaLinux, Debian, Fedora, Raspbian, RHEL, Rocky, Ubuntu)
      package:
        name:
          - docker-ce 
          - docker-ce-cli 
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin 
        state: latest
        update_cache: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Stop Docker (All)
      service:
        name: docker
        state: stopped
        enabled: false
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

######################################################
# T-Pot - Adjust configs, add users and groups, etc. #
######################################################

- name: T-Pot - Adjust configs, add users and groups, etc.
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Create T-Pot group (All)
      group:
        name: tpot
        gid: 2000
        state: present
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Create T-Pot user (All)
      user:
        name: tpot
        uid: 2000
        system: yes
        shell: /bin/false
        home: /nonexistent
        group: tpot
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Ensure vm.max_map_count is set (All)
      lineinfile:
        path: /etc/sysctl.conf
        line: "vm.max_map_count=262144"
        state: present
        create: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Ensure IPv4 forwarding is enabled (All)
      # Containers need it. Docker used to enable it on its own, with the
      # nftables firewall backend it refuses to start instead.
      lineinfile:
        path: /etc/sysctl.conf
        line: "net.ipv4.ip_forward=1"
        state: present
        create: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Enable IPv4 forwarding now (All)
      # Docker is started further down in this run, the value has to be live by
      # then and not only after the reboot
      command: sysctl -w net.ipv4.ip_forward=1
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Disable ssh.socket unit (Ubuntu)
      systemd:
        name: ssh.socket
        state: stopped
        enabled: false
      when: ansible_facts.distribution in ["Ubuntu"]
      tags:
        - "Ubuntu"

    - name: Remove ssh.socket.conf file (Ubuntu)
      file:
        path: /etc/systemd/system/ssh.service.d/00-socket.conf
        state: absent
      when: ansible_facts.distribution in ["Ubuntu"]
      tags:
        - "Ubuntu"

    - name: Comment out Port(s) in sshd_config, can cause port conflicts on deploy (AlmaLinux, Debian, Fedora, openSUSE Tumbleweed, Raspbian, RHEL, Rocky, Ubuntu)
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '^(Port (?!64295$)[0-9]+)'
        replace: '# \1'
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Change SSH Port to 64295 (AlmaLinux, Debian, Fedora, Raspbian, RHEL, Rocky, Ubuntu)
      lineinfile:
        path: /etc/ssh/sshd_config
        line: "Port 64295"
        insertafter: EOF
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Change SSH Port to 64295 (openSUSE Tumbleweed)
      lineinfile:
        path: /etc/ssh/sshd_config.d/port.conf
        line: "Port 64295"
        create: yes
      when: ansible_facts.distribution in ["openSUSE Tumbleweed"]
      tags:
        - "openSUSE Tumbleweed"

    - name: Install firewalld (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
      package:
        name: firewalld
        state: present
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Start firewalld (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
      service:
        name: firewalld
        state: started
        enabled: true
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Add T-Pot SSH port to Firewall (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
      firewalld:
        port: 64295/tcp
        permanent: yes
        state: enabled
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Set T-Pot default target to ACCEPT (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
      firewalld:
        zone: public
        target: ACCEPT
        permanent: yes
        state: enabled
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Look for the iptable_filter module (AlmaLinux, Fedora, RHEL, Rocky)
      # RHEL 10 and its rebuilds ship a kernel without the legacy xtables
      # modules, `modprobe iptable_filter` is fatal there. Those systems provide
      # `iptables` as the nftables based frontend instead, which relies on
      # nf_tables and loads it on its own - nothing has to be preloaded.
      # `-n` is a dry run, it reports whether the module exists without loading.
      ansible.builtin.command: modprobe -n iptable_filter
      register: my_iptable_filter
      changed_when: false
      failed_when: false
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "RedHat"
        - "Rocky"

    - name: Load kernel modules (AlmaLinux, Fedora, RHEL, Rocky)
      command: modprobe -v iptable_filter
      when:
        - ansible_facts.distribution in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
        - my_iptable_filter.rc | default(1) == 0
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "RedHat"
        - "Rocky"

    - name: Update iptables.conf (AlmaLinux, Fedora, RHEL, Rocky)
      # only where the module exists, systemd-modules-load logs a failure for
      # every entry it cannot find
      lineinfile:
        path: /etc/modules-load.d/iptables.conf
        line: iptable_filter
        create: yes
      when:
        - ansible_facts.distribution in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
        - my_iptable_filter.rc | default(1) == 0
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "RedHat"
        - "Rocky"

    - name: Look for the xt_addrtype module (All)
      # Docker's iptables backend needs the xtables extensions. RHEL 10 and its
      # rebuilds ship a kernel without them, dockerd then aborts with
      # "Extension addrtype revision 0 not supported, missing kernel module?"
      # and cannot create its bridge network. Docker 28 and up can talk to
      # nftables directly instead.
      ansible.builtin.command: modprobe -n xt_addrtype
      register: my_xt_addrtype
      changed_when: false
      failed_when: false
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Look for the nftables firewall backend in dockerd (All, kernels without xtables)
      ansible.builtin.shell: dockerd --help | grep -q -- --firewall-backend
      args:
        executable: /bin/bash
      register: my_dockerd_nftables
      changed_when: false
      failed_when: false
      when: my_xt_addrtype.rc | default(0) != 0
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Abort if Docker cannot manage the firewall on this kernel (All, kernels without xtables)
      assert:
        that: my_dockerd_nftables.rc == 0
        fail_msg: |
          This kernel ships no xtables modules, so Docker cannot use its
          iptables firewall backend, and this Docker Engine does not offer the
          nftables backend either. A newer Docker Engine is required.
        success_msg: "Docker will manage the firewall through nftables."
      when: my_xt_addrtype.rc | default(0) != 0
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Create the Docker configuration directory (All, kernels without xtables)
      file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: my_xt_addrtype.rc | default(0) != 0
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Look for an existing Docker configuration (All, kernels without xtables)
      stat:
        path: /etc/docker/daemon.json
      register: my_docker_json
      when: my_xt_addrtype.rc | default(0) != 0
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Read an existing Docker configuration (All, kernels without xtables)
      slurp:
        src: /etc/docker/daemon.json
      register: my_docker_json_content
      when: my_docker_json.stat.exists | default(false)
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Switch Docker to the nftables firewall backend (All, kernels without xtables)
      # merged into an existing daemon.json so hand made settings survive
      copy:
        dest: /etc/docker/daemon.json
        content: "{{ my_docker_config | combine({'firewall-backend': 'nftables'}) | to_nice_json }}\n"
        owner: root
        group: root
        mode: '0644'
      vars:
        my_docker_config: "{{ (my_docker_json_content.content | b64decode | from_json) if my_docker_json.stat.exists | default(false) else {} }}"
      when: my_xt_addrtype.rc | default(0) != 0
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Set SELinux config to permissive (AlmaLinux, Fedora, RHEL, Rocky)
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=permissive'
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "RedHat"
        - "Rocky"

    - name: Set SELinux to permissive (AlmaLinux, Fedora, RHEL, Rocky)
      command: "setenforce Permissive"
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "RedHat"
        - "Rocky"

    - name: Look for the systemd-resolved unit (All)
      # Wherever systemd-resolved runs it holds tcp/53 and udp/53 on 127.0.0.53
      # and 127.0.0.54, which keeps the DNS honeypots from binding - a cloud
      # image of any distribution may ship it, so ask the system instead of
      # listing distributions. A masked unit cannot listen and is left alone.
      ansible.builtin.command: systemctl list-unit-files systemd-resolved.service
      register: my_resolved_unit
      changed_when: false
      failed_when: false
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Remember whether the resolved stub listener can be running (All)
      ansible.builtin.set_fact:
        my_resolved_present: "{{ 'systemd-resolved.service' in my_resolved_unit.stdout and 'masked' not in my_resolved_unit.stdout }}"
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Stop Resolved (All)
      service:
        name: systemd-resolved
        state: stopped
      when: my_resolved_present | bool
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Copy resolv.conf to /etc/systemd (RHEL)
      copy:
        src: /usr/lib/systemd/resolv.conf
        dest: /etc/systemd/resolv.conf
      when: ansible_facts.distribution in ["RedHat"]
      ignore_errors: true
      tags:
        - "RedHat"

    - name: Create the resolved drop-in directory (All)
      file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: my_resolved_present | bool
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Disable the resolved stub listener (All)
      # A drop-in works no matter whether the distribution ships an
      # /etc/systemd/resolved.conf, and the uninstaller only has to delete it.
      copy:
        dest: /etc/systemd/resolved.conf.d/tpot.conf
        content: |
          # T-Pot honeypots publish tcp/53 and udp/53, the stub listener on
          # 127.0.0.53 and 127.0.0.54 would keep them from binding. Name
          # resolution on the host keeps working through nss-resolve.
          [Resolve]
          DNSStubListener=no
        owner: root
        group: root
        mode: '0644'
      when: my_resolved_present | bool
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

############################
# T-Pot - Restart services #
############################

- name: T-Pot - Restart services
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Start Resolved (All)
      service:
        name: systemd-resolved
        state: restarted
      when: my_resolved_present | default(false) | bool
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Restart Firewalld (AlmaLinux, Fedora, openSUSE Tumbleweed, Rocky)
      service:
        name: firewalld
        state: restarted
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Get Firewall rules (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
      command: "firewall-cmd --list-all"
      register: firewall_output
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Print Firewall rules (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
      debug:
        var: firewall_output.stdout_lines
      when: ansible_facts.distribution in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
      tags:
        - "AlmaLinux"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "RedHat"
        - "Rocky"

    - name: Enable Docker Engine upon boot (All)
      service:
        name: docker
        state: restarted
        enabled: true
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Restart SSH (All)
      service:
        name: "{{ 'ssh' if ansible_facts.distribution in ['Ubuntu'] else 'sshd' }}"
        state: restarted
        enabled: true
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

#######################################################################
# T-Pot - Adjust group users, bashrc, clone / update T-Pot repository #
#######################################################################

- name: T-Pot - Adjust group users, bashrc, clone / update T-Pot repository
  hosts: all
  gather_facts: true
  become: false
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

  tasks:
    - name: Check for non-root user id (All)
      debug:
        msg: "Detected user: '{{ ansible_facts.user_id }}'"
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      failed_when: ansible_facts.user_id == "root"

    - name: Add aliases
      blockinfile:
        path: ~/.bashrc
        block: |
          alias dps='{{ "grc --colour=on " if ansible_facts.distribution != "RedHat" else "" }}docker ps -f status=running -f status=exited --format "table {{'{{'}}.Names{{'}}'}}\\t{{'{{'}}.Status{{'}}'}}\\t{{'{{'}}.Ports{{'}}'}}" | sort'
          alias dim='{{ "grc --colour=on " if ansible_facts.distribution != "RedHat" else "" }}docker images --format "table {{'{{'}}.Repository{{'}}'}}\\t{{'{{'}}.Tag{{'}}'}}\\t{{'{{'}}.ID{{'}}'}}\\t{{'{{'}}.Size{{'}}'}}\\t{{'{{'}}.CreatedSince{{'}}'}}\\t{{'{{'}}.Repository{{'}}'}}:{{'{{'}}.Tag{{'}}'}}"'
          alias dpsw='watch -c bash -ic dps'
          alias mi='micro'
          alias sudo='sudo '
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        insertafter: EOF
        state: present
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
      tags:
        - "AlmaLinux"
        - "Debian"
        - "Fedora"
        - "openSUSE Tumbleweed"
        - "Raspbian"
        - "RedHat"
        - "Rocky"
        - "Ubuntu"

    - name: Report the T-Pot repository and branch (All)
      debug:
        msg: "Cloning {{ tpot_repo | default('https://github.com/telekom-security/tpotce', true) }} at {{ tpot_branch | default('master', true) }}."
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]

    - name: Clone / Update T-Pot repository (All)
      # install.sh passes both as extra vars, a standalone playbook run without
      # them stays on master
      git:
        repo: "{{ tpot_repo | default('https://github.com/telekom-security/tpotce', true) }}"
        dest: '{{ ansible_facts.user_dir }}/tpotce/'
        version: "{{ tpot_branch | default('master', true) }}"
        clone: yes
        update: no
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]

    - name: Add current user to Docker, T-Pot group (All)
      become: true
      user:
        name: "{{ ansible_facts.user_id }}"
        groups: 
          - docker
          - tpot
        append: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]

########################################
# T-Pot - Install service and cron job #
########################################

- name: T-Pot - Install service
  hosts: all
  gather_facts: true
  become: false
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

  tasks:
    - name: Install systemd service (All)
      become: true
      ansible.builtin.template:
        src: '{{ ansible_facts.user_dir }}/tpotce/installer/install/tpot.service'
        dest: '/etc/systemd/system/tpot.service'
        owner: root
        group: root
        mode: '0755'
      notify: Reload systemd and enable service
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]

  handlers:
    - name: Reload systemd and enable service
      become: true
      ansible.builtin.systemd:
        name: tpot.service
        daemon_reload: yes
        state: stopped
        enabled: yes
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]

- name: T-Pot - Setup a randomized daily reboot
  hosts: all
  gather_facts: true
  become: yes
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

  vars:
    random_minute: "{{ range(0, 60) | random }}"
    random_hour: "{{ range(0, 5) | random }}" # We want the reboot randomly happen at night

  tasks:
    - name: Setup a randomized daily reboot (All)
      cron:
        name: "T-Pot Daily Reboot"
        user: root
        minute: "{{ random_minute }}"
        hour: "{{ random_hour }}"
        job: "bash -c 'systemctl stop tpot.service && docker container prune -f; docker image prune -f; docker volume prune -f; /usr/sbin/shutdown -r +1 \"T-Pot Daily Reboot\"'"
        state: present
      when: ansible_facts.distribution in ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
