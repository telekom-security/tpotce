# T-Pot (installer/install/auto-updates): the Debian security updates once a week, Sundays between
# 06:00 and 07:00, after the nightly reboot of T-Pot (00:00 - 04:59). Persistent=true of the timer
# catches up on a run the host missed at its next start.
[Timer]
OnCalendar=
OnCalendar=Sun *-*-* 06:00
RandomizedDelaySec=60m
