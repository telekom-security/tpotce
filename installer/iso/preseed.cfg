#### The answers of the T-Pot ISO for the Debian installer (preseed/file=/cdrom/tpot/preseed.cfg).
#
# Only answers that are safe on any machine: the disks (partitioning), the boot loader, the user,
# the passwords, the language, the keyboard and the time zone stay with the person installing.
# Nothing here erases a disk on its own. "seen false" keeps a question asked, with the value as
# its default. tpotctl/tests/test_iso.py checks these rules.

### Ask for keyboards that Debian's legacy device-name detection missed (e.g. virtio in ARM VMs).
d-i preseed/early_command string sh /cdrom/tpot/early.sh

### Network: the host name is asked, t-pot is its default
d-i netcfg/get_hostname string t-pot
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/get_domain seen false

### Mirror: the Debian CDN, a proxy is still asked
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/http/proxy seen false

### Accounts: no root login, the user created during the installation gets sudo (install.sh
### refuses root). Its name and its password are asked.
d-i passwd/root-login boolean false

### Clock: UTC and NTP, the time zone is asked
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Packages: no desktop or display manager. A local login can open an authenticated, temporary
### Xorg terminal for the installer and Manager; SSH and the text console remain available. The
### packages the T-Pot installer needs (install.sh: myPACKAGES_DEBIAN) come along, so it starts
### without installing anything (prepare.sh sets up the rest from the ISO).
d-i apt-setup/cdrom/set-first boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string ansible apache2-utils ca-certificates console-setup cracklib-runtime curl fonts-dejavu-core git kbd keyboard-configuration matchbox-window-manager python3-venv sudo wget xauth xinit xserver-xorg-core xserver-xorg-input-libinput xserver-xorg-legacy xserver-xorg-video-fbdev xterm
popularity-contest popularity-contest/participate boolean false

### T-Pot: the installer of the ISO starts after the first boot on the console (tty8, chvt of kbd),
### or at a login (late.sh)
d-i preseed/late_command string sh /cdrom/tpot/late.sh
